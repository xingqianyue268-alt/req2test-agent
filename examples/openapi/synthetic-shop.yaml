openapi: 3.1.0
info:
  title: Req2Test Synthetic Shop
  version: '1.0'
paths:
  /login:
    post:
      summary: Login
      operationId: login_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /users/{user_id}:
    get:
      summary: User
      operationId: user_users__user_id__get
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: integer
          title: User Id
      - name: authorization
        in: header
        required: false
        schema:
          type: string
          default: ''
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: authentication required
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /products:
    get:
      summary: Products
      operationId: products_products_get
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 5
          minimum: 1
          default: 1
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
                title: Response Products Products Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      summary: Create Product
      operationId: create_product_products_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /validate:
    post:
      summary: Validate
      operationId: validate_validate_post
      parameters:
      - name: quantity
        in: query
        required: true
        schema:
          type: integer
          minimum: 1
          title: Quantity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    Login:
      properties:
        username:
          type: string
          minLength: 1
          title: Username
          examples:
          - demo
          example: demo
        password:
          type: string
          minLength: 1
          title: Password
          examples:
          - demo
          example: demo
      type: object
      required:
      - username
      - password
      title: Login
    LoginResponse:
      properties:
        access_token:
          type: string
          title: Access Token
        token_type:
          type: string
          title: Token Type
      type: object
      required:
      - access_token
      - token_type
      title: LoginResponse
    Metadata:
      properties:
        active:
          type: boolean
          title: Active
        tags:
          items:
            type: string
          type: array
          title: Tags
      type: object
      required:
      - active
      - tags
      title: Metadata
    Product:
      properties:
        name:
          type: string
          minLength: 1
          title: Name
        price:
          type: integer
          minimum: 1.0
          title: Price
        metadata:
          $ref: '#/components/schemas/Metadata'
      type: object
      required:
      - name
      - price
      - metadata
      title: Product
    User:
      properties:
        id:
          type: integer
          title: Id
        name:
          type: string
          title: Name
      type: object
      required:
      - id
      - name
      title: User
    ValidationError:
      properties:
        loc:
          items:
            type:
            - string
            - integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
servers:
- url: http://127.0.0.1:8081
