name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: req2test_test
          POSTGRES_USER: req2test
          POSTGRES_PASSWORD: req2test_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U req2test -d req2test_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      REQ2TEST_ENV: test
      JWT_SECRET_KEY: github-actions-test-key-not-for-production
      DATABASE_URL: postgresql+psycopg://req2test:req2test_test@localhost:5432/req2test_test
      REQ2TEST_TEST_DATABASE_URL: postgresql+psycopg://req2test:req2test_test@localhost:5432/req2test_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run tests
        run: pytest -q
