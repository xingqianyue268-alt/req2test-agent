name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: req2test_test
          POSTGRES_USER: req2test
          POSTGRES_PASSWORD: req2test_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U req2test -d req2test_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      REQ2TEST_ENV: test
      JWT_SECRET_KEY: github-actions-test-key-not-for-production
      DATABASE_URL: postgresql+psycopg://req2test:req2test_test@localhost:5432/req2test_test
      REQ2TEST_TEST_DATABASE_URL: postgresql+psycopg://req2test:req2test_test@localhost:5432/req2test_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Verify test database
        run: python scripts/ci_test_gate.py --preflight --output artifacts/environment.json

      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          pytest -q --junitxml=artifacts/pytest.xml 2>&1 | tee artifacts/pytest.log

      - name: Enforce complete regression
        if: always()
        run: python scripts/ci_test_gate.py

      - name: Run deterministic evaluation gate
        shell: bash
        run: |
          set -o pipefail
          python scripts/run_eval.py --dataset evals/golden_demo.jsonl --mode demo --min-score 80 2>&1 | tee artifacts/evaluation.log

      - name: Retain test evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
