[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "req2test-agent"
version = "0.2.0"
description = "面向中文需求文档的多智能体测试用例设计与异步任务平台"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = {text = "MIT"}
authors = [
  {name = "Xing Qianyue"}
]
dependencies = [
  "langgraph>=1.0,<2.0",
  "langchain-openai>=1.0,<2.0",
  "streamlit>=1.40,<2.0",
  "pydantic>=2.8,<3.0",
  "python-dotenv>=1.0,<2.0",
  "python-docx>=1.1,<2.0",
  "pypdf>=5.0,<7.0",
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.32,<1.0",
  "celery>=5.4,<6.0",
  "redis>=5.2,<7.0",
  "chromadb>=1.0,<2.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<10.0",
  "ruff>=0.9,<1.0",
  "httpx>=0.28,<1.0"
]

[project.scripts]
req2test = "req2test.cli:main"
req2test-kb = "req2test.kb_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
